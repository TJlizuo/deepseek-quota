<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="description" content="DeepSeek API 余额查询工具">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>DeepSeek 额度查询</title>
  <style>
    /* ============================================
       Reset & Variables
       ============================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #0f0f1a;
      --bg-card: #1a1a2e;
      --bg-input: #16213e;
      --bg-hover: #1f2b47;
      --text-primary: #e8e8f0;
      --text-secondary: #9898b8;
      --text-muted: #6a6a8a;
      --accent: #4fc3f7;
      --accent-glow: rgba(79, 195, 247, 0.25);
      --green: #66bb6a;
      --red: #ef5350;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html {
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      padding-bottom: 80px;
    }

    /* ============================================
       Layout
       ============================================ */
    .container {
      width: 100%;
      max-width: 420px;
    }

    /* ============================================
       Header
       ============================================ */
    .header {
      text-align: center;
      padding: 32px 0 24px;
    }

    .header .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #4fc3f7, #0288d1);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 12px;
      box-shadow: 0 0 40px var(--accent-glow);
    }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #e8e8f0, #4fc3f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* ============================================
       Card
       ============================================ */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.04);
    }

    .card-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 600;
    }

    /* ============================================
       Form
       ============================================ */
    .input-group {
      position: relative;
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border: 1.5px solid rgba(255,255,255,0.06);
      border-radius: var(--radius-sm);
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.92rem;
      padding: 14px 12px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      letter-spacing: 0.3px;
      min-width: 0;
    }

    .input-wrapper input::placeholder {
      color: var(--text-muted);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: 0;
      font-size: 0.85rem;
    }

    .toggle-key {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      padding: 8px 12px;
      cursor: pointer;
      transition: color var(--transition);
      line-height: 1;
    }

    .toggle-key:hover {
      color: var(--text-secondary);
    }

    /* ============================================
       Button
       ============================================ */
    .btn-primary {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #4fc3f7, #0288d1);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 4px 16px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .btn-primary.loading .spinner {
      display: inline-block;
    }

    .btn-primary.loading .btn-text {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ============================================
       Status Badge
       ============================================ */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .status-badge.available {
      background: rgba(102, 187, 106, 0.15);
      color: var(--green);
    }

    .status-badge.unavailable {
      background: rgba(239, 83, 80, 0.15);
      color: var(--red);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.available {
      background: var(--green);
      box-shadow: 0 0 8px rgba(102, 187, 106, 0.6);
    }

    .status-dot.unavailable {
      background: var(--red);
      box-shadow: 0 0 8px rgba(239, 83, 80, 0.6);
    }

    /* ============================================
       Balance Grid
       ============================================ */
    .balance-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }

    .balance-item {
      background: var(--bg-input);
      border-radius: var(--radius-sm);
      padding: 14px 12px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.04);
      transition: transform var(--transition);
    }

    .balance-item:active {
      transform: scale(0.97);
    }

    .balance-item .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .balance-item .value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    }

    .balance-item .value.currency-cny::before {
      content: '¥';
      font-size: 0.9rem;
      margin-right: 1px;
    }

    .balance-item .value.currency-usd::before {
      content: '$';
      font-size: 0.9rem;
      margin-right: 1px;
    }

    .balance-item.highlight {
      background: linear-gradient(135deg, rgba(79, 195, 247, 0.12), rgba(2, 136, 209, 0.08));
      border-color: rgba(79, 195, 247, 0.2);
    }

    .balance-item.highlight .value {
      color: var(--accent);
    }

    .balance-item .sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ============================================
       Results Area
       ============================================ */
    .results {
      display: none;
      animation: fadeUp 0.4s ease;
    }

    .results.visible {
      display: block;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .results .card {
      animation: fadeUp 0.4s ease;
    }

    /* ============================================
       Error
       ============================================ */
    .error-msg {
      background: rgba(239, 83, 80, 0.1);
      border: 1px solid rgba(239, 83, 80, 0.25);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      color: var(--red);
      font-size: 0.85rem;
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .error-msg.visible {
      display: flex;
    }

    .error-msg .error-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    /* ============================================
       Info Bar
       ============================================ */
    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin-top: 12px;
    }

    .info-bar .timestamp {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .btn-refresh {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 8px;
      transition: background var(--transition);
    }

    .btn-refresh:hover {
      background: rgba(79, 195, 247, 0.1);
    }

    /* ============================================
       Footer
       ============================================ */
    .footer {
      text-align: center;
      padding: 24px 0 8px;
      color: var(--text-muted);
      font-size: 0.72rem;
    }

    .footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    /* ============================================
       Skeleton Loading
       ============================================ */
    .skeleton {
      display: none;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.04);
    }

    .skeleton.visible {
      display: block;
      animation: fadeUp 0.3s ease;
    }

    .skeleton-bar {
      height: 14px;
      background: linear-gradient(90deg, var(--bg-input) 25%, var(--bg-hover) 50%, var(--bg-input) 75%);
      background-size: 200% 100%;
      border-radius: 8px;
      margin-bottom: 10px;
      animation: shimmer 1.5s ease-in-out infinite;
    }

    .skeleton-bar:last-child {
      margin-bottom: 0;
    }

    .skeleton-bar.w60 { width: 60%; }
    .skeleton-bar.w40 { width: 40%; }
    .skeleton-bar.h24 { height: 24px; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ============================================
       Multiple currencies support
       ============================================ */
    .currency-section {
      margin-top: 14px;
    }

    .currency-section:first-child {
      margin-top: 0;
    }

    .currency-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    /* ============================================
       Responsive
       ============================================ */
    @media (max-width: 360px) {
      .balance-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .balance-item {
        padding: 10px 8px;
      }

      .balance-item .value {
        font-size: 1.1rem;
      }
    }

    @media (min-width: 600px) {
      body {
        padding: 32px 24px;
      }
    }

    /* ============================================
       Safe area for notch phones
       ============================================ */
    @supports (padding: max(0px)) {
      body {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
        padding-top: max(16px, env(safe-area-inset-top));
        padding-bottom: max(80px, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">🧠</div>
      <h1>DeepSeek 额度查询</h1>
      <p>查看你的 DeepSeek API 余额和可用状态</p>
    </div>

    <!-- API Key Input -->
    <div class="card">
      <div class="card-title">🔑 API 密钥</div>
      <div class="input-group">
        <label for="apiKey">DeepSeek API Key</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="apiKey"
            placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="toggle-key" id="toggleKey" type="button" aria-label="切换显示密钥">
            👁️
          </button>
        </div>
        <div style="margin-top: 6px; font-size: 0.72rem; color: var(--text-muted);">
          从 <a href="https://platform.deepseek.com" target="_blank" rel="noopener" style="color: var(--accent);">platform.deepseek.com</a> 获取
        </div>
      </div>

      <button class="btn-primary" id="queryBtn" type="button">
        <span class="spinner"></span>
        <span class="btn-text">🔍 查询余额</span>
      </button>
    </div>

    <!-- Error Message -->
    <div class="error-msg" id="errorMsg">
      <span class="error-icon">⚠️</span>
      <span id="errorText"></span>
    </div>

    <!-- Skeleton Loading -->
    <div class="skeleton" id="skeleton">
      <div class="skeleton-bar w60"></div>
      <div class="skeleton-bar w40 h24"></div>
      <div class="skeleton-bar"></div>
    </div>

    <!-- Results -->
    <div class="results" id="results">
      <div class="card">
        <div class="card-title">📊 账户概览</div>
        <div id="statusContainer"></div>
        <div id="balanceContainer"></div>

        <div class="info-bar">
          <span class="timestamp" id="timestamp"></span>
          <button class="btn-refresh" id="refreshBtn">🔄 刷新</button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>数据来自 <a href="https://api-docs.deepseek.com/api/get-user-balance" target="_blank" rel="noopener">DeepSeek API</a></p>
      <p style="margin-top: 2px;">API Key 仅存于本地，仅发往 DeepSeek 官方接口</p>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ============================================
      // DOM References
      // ============================================
      const apiKeyInput    = document.getElementById('apiKey');
      const toggleKeyBtn   = document.getElementById('toggleKey');
      const queryBtn       = document.getElementById('queryBtn');
      const errorMsg       = document.getElementById('errorMsg');
      const errorText      = document.getElementById('errorText');
      const skeleton       = document.getElementById('skeleton');
      const results        = document.getElementById('results');
      const statusContainer = document.getElementById('statusContainer');
      const balanceContainer = document.getElementById('balanceContainer');
      const timestamp      = document.getElementById('timestamp');
      const refreshBtn     = document.getElementById('refreshBtn');

      // ============================================
      // State
      // ============================================
      const STORAGE_KEY = 'deepseek_quota_api_key';
      let isLoading = false;

      // ============================================
      // Init: restore saved key
      // ============================================
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          apiKeyInput.value = saved;
        }
      } catch (e) {
        // localStorage may be unavailable in file:// mode
      }

      // ============================================
      // Toggle API Key visibility
      // ============================================
      toggleKeyBtn.addEventListener('click', function() {
        const isPassword = apiKeyInput.type === 'password';
        apiKeyInput.type = isPassword ? 'text' : 'password';
        toggleKeyBtn.textContent = isPassword ? '🙈' : '👁️';
      });

      // ============================================
      // Auto-save key on input
      // ============================================
      apiKeyInput.addEventListener('input', function() {
        try {
          if (this.value) {
            localStorage.setItem(STORAGE_KEY, this.value);
          } else {
            localStorage.removeItem(STORAGE_KEY);
          }
        } catch (e) {
          // silently fail
        }
      });

      // ============================================
      // Keyboard: Enter to query
      // ============================================
      apiKeyInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          queryBalance();
        }
      });

      // ============================================
      // Query Balance
      // ============================================
      function showError(msg) {
        errorText.textContent = msg;
        errorMsg.classList.add('visible');
      }

      function hideError() {
        errorMsg.classList.remove('visible');
        errorText.textContent = '';
      }

      function showLoading() {
        isLoading = true;
        queryBtn.classList.add('loading');
        queryBtn.disabled = true;
        skeleton.classList.add('visible');
        results.classList.remove('visible');
        hideError();
      }

      function hideLoading() {
        isLoading = false;
        queryBtn.classList.remove('loading');
        queryBtn.disabled = false;
        skeleton.classList.remove('visible');
      }

      function formatTime(ts) {
        const d = new Date(ts);
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      }

      function renderResults(data) {
        // Status badge
        const isAvailable = data.is_available;
        const statusHTML = `
          <div class="status-badge ${isAvailable ? 'available' : 'unavailable'}">
            <span class="status-dot ${isAvailable ? 'available' : 'unavailable'}"></span>
            ${isAvailable ? '账户可用' : '账户不可用'}
          </div>
        `;
        statusContainer.innerHTML = statusHTML;

        // Balance cards
        const infos = data.balance_infos || [];
        if (infos.length === 0) {
          balanceContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">暂无余额信息</p>';
        } else {
          const sections = infos.map(info => {
            const currencySymbol = info.currency === 'CNY' ? '¥' : info.currency === 'USD' ? '$' : '';
            const currencyClass = info.currency === 'CNY' ? 'currency-cny' : info.currency === 'USD' ? 'currency-usd' : '';

            return `
              <div class="currency-section">
                <div class="currency-label">${info.currency}</div>
                <div class="balance-grid">
                  <div class="balance-item highlight">
                    <div class="label">总余额</div>
                    <div class="value ${currencyClass}">${formatBalance(info.total_balance)}</div>
                    <div class="sub">可用的总额度</div>
                  </div>
                  <div class="balance-item">
                    <div class="label">充值余额</div>
                    <div class="value ${currencyClass}">${formatBalance(info.topped_up_balance)}</div>
                    <div class="sub">已充值金额</div>
                  </div>
                  <div class="balance-item">
                    <div class="label">赠送余额</div>
                    <div class="value ${currencyClass}">${formatBalance(info.granted_balance)}</div>
                    <div class="sub">免费赠送额度</div>
                  </div>
                </div>
              </div>
            `;
          });
          balanceContainer.innerHTML = sections.join('');
        }

        // Timestamp
        timestamp.textContent = `更新于 ${formatTime(Date.now())}`;

        // Show
        results.classList.add('visible');
      }

      function formatBalance(val) {
        const num = parseFloat(val);
        if (isNaN(num)) return val;
        return num.toFixed(2);
      }

      async function queryBalance() {
        const key = apiKeyInput.value.trim();
        if (!key) {
          showError('请输入 DeepSeek API Key');
          apiKeyInput.focus();
          return;
        }

        // Basic format check
        if (!key.startsWith('sk-')) {
          showError('API Key 格式似乎不对，应以 sk- 开头');
          // Still proceed — user might have a different format
        }

        showLoading();

        try {
          const response = await fetch('https://api.deepseek.com/user/balance', {
            method: 'GET',
            headers: {
              'Accept': 'application/json',
              'Authorization': 'Bearer ' + key
            }
          });

          if (!response.ok) {
            let msg = '';
            if (response.status === 401) {
              msg = '认证失败：API Key 无效或已过期，请在 platform.deepseek.com 检查';
            } else if (response.status === 429) {
              msg = '请求过于频繁，请稍后再试';
            } else if (response.status >= 500) {
              msg = 'DeepSeek 服务器异常，请稍后再试';
            } else {
              msg = `请求失败 (HTTP ${response.status})`;
            }
            throw new Error(msg);
          }

          const data = await response.json();
          hideError();
          renderResults(data);

          // Also save to localStorage again to refresh timestamp usage
          try {
            localStorage.setItem(STORAGE_KEY, key);
          } catch (e) {}

        } catch (err) {
          hideLoading();
          if (err.name === 'TypeError' && err.message.includes('fetch')) {
            showError('网络请求失败，请检查网络连接或跨域设置。在 file:// 协议下可能需要通过 HTTP 服务访问');
          } else {
            showError(err.message || '查询失败，请稍后重试');
          }
          return;
        }

        hideLoading();
      }

      // ============================================
      // Event Listeners
      // ============================================
      queryBtn.addEventListener('click', queryBalance);
      refreshBtn.addEventListener('click', queryBalance);

      // ============================================
      // Auto-query on load if key exists
      // ============================================
      if (apiKeyInput.value) {
        // Small delay to let the page render first
        setTimeout(queryBalance, 500);
      }

    })();
  </script>
</body>
</html>
